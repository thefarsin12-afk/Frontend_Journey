<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red-Bull-Product-Card</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">

        <div class="card-image">
            <img src="assets/image/pngwing.com.png" alt="">
        </div>
        <div class="card-content">

            <div class="card-text">
            <p>REDBULL</p>
            <h2 class="card-product">RedBull</h2>
            <h2 class="card-price">$14 <span class="old-price">18</span></h2>
            </div>
            <button>BUY</button>
        </div>
    </div>

</body>

</html>
