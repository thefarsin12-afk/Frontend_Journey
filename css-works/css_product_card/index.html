<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!--product parent-->

    <div class="card">

        
        <div class="badge">
            10% off
        </div>

        <!--card image-->
        <div class="card-image">
            <img src="image/pngwing.com.png" alt="">
        </div>

        <!--card heading-->
        <div class="card-content">
            <h1>Nike Air Max Runner</h1>

            <!--product description-->
            <p>Stylish and comfortable sports <br>shoes designed for everyday <br> wear, running, and casual
                activities.<br>
                Lightweight design with cushioned <br>support and excellent grip.</p>

            <!--product price-->
            <h1>$15</h1>

            <!--order button-->
            <button>Order Now</button>
        </div>

    </div>

</body>

</html>
