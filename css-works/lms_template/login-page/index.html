<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="born">
        <!--navigation starting-->
        <div class="navbar-container">

            <div class="left-area">
                <h1>Learn <span style="color: #3e35dc;">Hub</span></h1>
            </div>

            <div class="right-area">
                <a href="#">Home</a>
                <a href="#">Course</a>
                <a href="#">My Course</a>
                <a href="#">Login</a>
                <button>Sign Up</button>
            </div>

        </div>
        <!--navigation ending-->
        <div class="d-flex justify-content-center ">
            <form
                class="row g-3 w-25 mt-5 border border-primary-subtle rounded-3 p-5 shadow-lg p-3 mb-5 bg-body-tertiary rounded">
                <div class="col-md-6">
                    <label for="inputEmail4" class="form-label ">Email</label>
                    <input type="email" class="form-control" id="inputEmail4" placeholder="Enter Email">
                </div>
                <div class="col-md-6">
                    <label for="inputPassword4" class="form-label">Password</label>
                    <input type="password" class="form-control" id="inputPassword4" placeholder="Enter Password">
                </div>
                <div class="col-12">
                    <label for="inputAddress" class="form-label">Address</label>
                    <input type="text" class="form-control" id="inputAddress" placeholder="1234 Main St">
                </div>
                <div class="col-12">
                    <label for="inputAddress2" class="form-label">Address 2</label>
                    <input type="text" class="form-control" id="inputAddress2"
                        placeholder="Apartment, studio, or floor">
                </div>
                <div class="col-md-6">
                    <label for="inputCity" class="form-label">City</label>
                    <input type="text" class="form-control" id="inputCity">
                </div>
                <div class="col-md-4">
                    <label for="inputState" class="form-label">State</label>
                    <select id="inputState" class="form-select">
                        <option selected>Choose...</option>
                        <option>...</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label for="inputZip" class="form-label">Zip</label>
                    <input type="text" class="form-control" id="inputZip">
                </div>
                <div class="col-12">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="gridCheck">
                        <label class="form-check-label" for="gridCheck">
                            Check me out
                        </label>
                    </div>
                </div>
                <div class="col-12 d-flex justify-content-center w-100">
                    <button type="submit" class="btn btn-primary ">Sign in</button>
                </div>
            </form>
        </div>

</body>
