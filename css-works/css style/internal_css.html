<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 
    <style>
        h1 {

            background-color: red;
            color: white;
        }

        h2 {

            background-color: blue;
            color: white;
            border: 1px solid black;
        }

        .heading {

            background-color: aquamarine;
            color: white;
        }

        .bg-danger {
            background-color: red;
            color: black;
        }

        .border-success{
            border: 2px solid green;
        }

        .bg-primary {
            background-color: blue;
        }
        .color-white {
            color: white;
        }
    </style>
</head>

<body>

    <h1>hello world</h1>

    <h2>hello world</h2>

    <!-- selecting class -->
    
    <h2 class="heading">hello world</h2>

    <h1 class="bg-danger" class="border-success">hello world</h1>

    <h1 class="bg-primary" class="color-white">hello</h1>



</body>

</html>
